
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudGallery</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #182230;
        }

        header {
            background: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        header h1 {
            color: #536dfe;
            font-size: 25px;
        }

        main {
            max-width: 1100px;
            margin: 60px auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h2 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #64748b;
        }

        .upload {
            background: white;
            border: 2px dashed #a5b4fc;
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            margin-bottom: 40px;
        }

        button {
            background: #536dfe;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 9px;
            cursor: pointer;
            margin-top: 18px;
            font-size: 15px;
        }

        button:hover {
            background: #4055d6;
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .photo {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px #0000000d;
        }

        .photo img {
            width: 100%;
            height: 210px;
            object-fit: cover;
        }

        .photo p {
            padding: 12px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        #status {
            margin-top: 15px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }

        input {
            max-width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>☁ CloudGallery</h1>
    <span>My Online Gallery</span>
</header>

<main>
    <section class="hero">
        <h2>Your photos, everywhere.</h2>
        <p>Upload, store and share your favorite memories.</p>
    </section>

    <section class="upload">
        <h2>Upload your images</h2>
        <p>Choose images from your device.</p>

        <input type="file" id="fileInput" accept="image/*" multiple>

        <br>

        <button onclick="uploadImages()">Upload Images</button>

        <p id="status">Connecting to CloudGallery...</p>
    </section>

    <h2 style="margin-bottom:20px;">Explore Gallery</h2>
    <section id="gallery"></section>
</main>

<footer>
    © 2026 CloudGallery · Your memories in the cloud.
</footer>

<script>
    // Supabase configuration
    const SUPABASE_URL =
        "https://pfmwnzarkxzywqlbktfr.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_KqJjz8dff0SV-edCQTid4Q_1OGn5FC9";

   const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

    const BUCKET = "gallery";

    // Load stored images
    async function loadGallery() {
        const gallery = document.getElementById("gallery");

        gallery.innerHTML = "<p>Loading images...</p>";

        const { data, error } = await db.storage
            .from(BUCKET)
            .list("", {
                limit: 100,
                sortBy: {
                    column: "created_at",
                    order: "desc"
                }
            });

        if (error) {
            gallery.innerHTML = "<p>Unable to load gallery: " +
                error.message + "</p>";
            return;
        }

        gallery.innerHTML = "";

        const files = data.filter(file =>
            file.name !== ".emptyFolderPlaceholder"
        );

        for (const file of files) {
            const { data: urlData } = db.storage
                .from(BUCKET)
                .getPublicUrl(file.name);

            const card = document.createElement("div");
            card.className = "photo";

            const img = document.createElement("img");
            img.src = urlData.publicUrl;
            img.alt = file.name;
            img.loading = "lazy";

            const name = document.createElement("p");
            name.textContent = file.name;

            const share = document.createElement("button");
            share.textContent = "Copy Image Link";

            share.onclick = async () => {
                try {
                    await navigator.clipboard.writeText(
                        urlData.publicUrl
                    );
                    share.textContent = "Copied!";
                } catch {
                    prompt("Copy this image link:", urlData.publicUrl);
                }
            };

            card.appendChild(img);
            card.appendChild(name);
            card.appendChild(share);

            gallery.appendChild(card);
        }

        if (files.length === 0) {
            gallery.innerHTML =
                "<p>No images yet. Upload your first photo!</p>";
        }
    }

    // Upload images to Supabase
    async function uploadImages() {
        const input = document.getElementById("fileInput");
        const status = document.getElementById("status");

        const files = Array.from(input.files);

        if (files.length === 0) {
            status.textContent = "Please select an image first.";
            return;
        }

        for (const file of files) {

            if (!file.type.startsWith("image/")) {
                status.textContent = "Invalid image file.";
                continue;
            }

            if (file.size > 5 * 1024 * 1024) {
                status.textContent =
                    file.name + " exceeds the 5 MB limit.";
                continue;
            }

            status.textContent = "Uploading " + file.name + "...";

            const safeName = file.name.replace(
                /[^a-zA-Z0-9._-]/g, "_"
            );

            const path =
                Date.now() + "-" +
                crypto.randomUUID() + "-" +
                safeName;

            const { error } = await db.storage
                .from(BUCKET)
                .upload(path, file, {
                    contentType: file.type,
                    upsert: false
                });

            if (error) {
                status.textContent =
                    "Upload failed: " + error.message;
                return;
            }
        }

        status.textContent = "All images uploaded successfully!";

        input.value = "";

        await loadGallery();
    }

    // Start gallery
    loadGallery();
</script> 

</body>
</html>
